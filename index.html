/* ---------- storage (IndexedDB) ---------- */
const DB=new Promise((res,rej)=>{try{const r=indexedDB.open('cutroom',2);r.onupgradeneeded=()=>{const d=r.result;['media','projects','presets','folders'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s)})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});

const base=(c,key)=>{if(key=='vol')return c.vol;if(key.startsWith('tr.'))return c.tr[key.slice(3)];const[,id,k]=key.split(':');return c.fx.find(f=>f.id==id).p[k]};
const setBase=(c,key,v)=>{if(key=='vol')c.vol=v;else if(key.startsWith('tr.'))c.tr[key.slice(3)]=v;else{const[,id,k]=key.split(':');c.fx.find(f=>f.id==id).p[k]=v}};
const get=(c,key,t)=>val(c,key,t,base(c,key));
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
/* ---------- effects engine (Canvas2D, GPU-composited) ---------- */
const cvs={},sc=(n,w,h)=>{const c=cvs[n]??=document.createElement('canvas');if(c.width!==w||c.height!==h){c.width=w;c.height=h}return c};
const effectSamples=max=>Math.max(3,Math.round(max*(exporting?1:Math.max(.2,Q))));
// Sharpen uses a small WebGL2 convolution shader instead of repeatedly invoking

let sharpGPU=null;
function gpuSharpen(src,amount){
 try{
  const w=src.width,h=src.height;

   const c=document.createElement('canvas'),gl=c.getContext('webgl2',{alpha:true,premultipliedAlpha:false,preserveDrawingBuffer:true});

 }catch(e){return null}
}
let NZ;const noise=()=>{if(NZ)return NZ;NZ=el('canvas');NZ.width=NZ.height=256;const g=NZ.getContext('2d'),im=g.createImageData(256,256);for(let i=0;i<im.data.length;i+=4){im.data[i]=im.data[i+1]=im.data[i+2]=Math.random()*255;im.data[i+3]=255}g.putImageData(im,0,0);return NZ};

const rad=Math.PI/180;
const FX={
color:{n:'Color Correct',p:{bright:[0,-100,100],contrast:[0,-100,100],sat:[0,-100,100],exp:[0,-3,3,.05],hue:[0,-180,180],temp:[0,-100,100],tint:[0,-100,100]},f(d,s,p,w,h){d.filter=`brightness(${Math.max(0,(1+p.bright/100)*2**p.exp)}) contrast(${Math.max(0,1+p.contrast/100)}) saturate(${Math.max(0,1+p.sat/100)}) hue-rotate(${p.hue}deg)`;d.drawImage(s,0,0);d.filter='none';d.globalCompositeOperation='source-atop';for(const[v,a,b]of[[p.temp,'255,150,0','0,140,255'],[p.tint,'255,0,200','0,255,90']])if(v){d.fillStyle=`rgba(${v>0?a:b},${Math.abs(v)/100*.35})`;d.fillRect(0,0,w,h)}}},

dirblur:{n:'Directional / Motion Blur',p:{len:[60,0,400],ang:[0,0,360]},f(d,s,p,w){const n=effectSamples(14),L=p.len*w/1920,a=p.ang*rad;for(let i=0;i<n;i++){d.globalAlpha=1/(i+1);const o=(i/(n-1)-.5)*L;d.drawImage(s,Math.cos(a)*o,Math.sin(a)*o)}}},

/* ---------- WebGL2 effect pipeline + preview frame cache ---------- */
// GPU-capable effects are batched: the clip frame is uploaded once, every consecutive
// GPU effect runs as shader passes on ping-pong render targets (half-float when the
// driver allows it), and the result is read back into the 2D pipeline with ONE drawImage.
// Anything that fails to compile, or any runtime GL error, falls back to the original
// Canvas2D implementation, so no effect is ever lost.

layout(location=0) in vec2 a;out vec2 uv;void main(){uv=a*.5+.5;gl_Position=vec4(a,0.,1.);}`;
const GLH=`#version 300 es

const vec3 LUM=vec3(.2126,.7152,.0722);
vec4 S(vec2 p){return texture(tex,p);}
vec3 unp(vec4 c){return c.a>.0005?clamp(c.rgb/c.a,0.,1.):vec3(0.);}
vec4 pre(vec3 c,float a){return vec4(c*a,a);}
vec2 pix(vec2 p){return vec2(p.x*res.x,(1.-p.y)*res.y);}
